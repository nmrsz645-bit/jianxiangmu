name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_desktop_release.ps1 -OutputDir "$env:RUNNER_TEMP\release"
